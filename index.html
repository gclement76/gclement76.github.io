<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indispensable pour un affichage correct sur téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes projets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <h1>Mes projets</h1>
  </header>

  <main class="liste">
    <!--
      Une carte par projet.
      Pour ajouter un projet : copier tout le bloc <article> ... </article>
      et changer l'icône, le nom, la description et les deux liens.
    -->
    <article class="projet">
      <a class="projet-lien" href="https://gclement76.github.io/trace-course/">
        <span class="projet-icone" aria-hidden="true">🏃</span>
        <span class="projet-texte">
          <span class="projet-nom">Trace Course</span>
          <span class="projet-description">
            Préparer un parcours de course : distance, dénivelé, profil et temps estimé.
          </span>
        </span>
      </a>
      <a class="projet-code" href="https://github.com/gclement76/trace-course">Code</a>
    </article>
  </main>
</body>
</html>
